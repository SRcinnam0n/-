<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vaporwave Portal</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: linear-gradient(to right, #ff00cc, #333399);
      color: #fff;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.5em;
      text-shadow: 2px 2px #000;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
    }

    h1 span {
      display: inline-block;
      animation: wave 1.5s infinite;
      cursor: default;
    }

    h1 span.ghost {
      cursor: pointer;
      color: #00ffcc;
    }

    h1 span:nth-child(odd) {
      animation-delay: 0.1s;
    }

    h1 span:nth-child(even) {
      animation-delay: 0.3s;
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    input, button {
      margin-top: 20px;
      padding: 10px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
    }

    button {
      background-color: #00ffff;
      cursor: pointer;
    }

    #felicidades {
      display: none;
    }
  </style>
</head>
<body>
  <div id="inicio">
    <h1>
      <span>👻</span>
      <span onclick="location.href='letras.html'" class="ghost">👻</span>
      <span>A</span><span>d</span><span>i</span><span>v</span><span>i</span><span>n</span><span>a</span>
      <span> </span><span>e</span><span>l</span>
      <span> </span><span>c</span><span>ó</span><span>d</span><span>i</span><span>g</span><span>o</span>
      <span> </span><span>d</span><span>e</span><span>l</span>
      <span> </span><span>p</span><span>o</span><span>r</span><span>t</span><span>a</span><span>l</span>
      <span> </span><span class="ghost" onclick="location.href='letras.html'">👻</span>
    </h1>
    <p>Escribe un número del 1 al 100:</p>
    <input type="number" id="numero">
    <button onclick="verificarNumero()">Entrar</button>
  </div>

  <div id="felicidades">
    <h2>🎉 Felicidades 🎉</h2>
    <p>Acabas de perder tu tiempo 😎</p>
  </div>

  <script>
    function verificarNumero() {
      const num = parseInt(document.getElementById('numero').value);
      if (num === 61) {
        document.getElementById('inicio').style.display = 'none';
        document.getElementById('felicidades').style.display = 'block';
      } else {
        alert("No es el número correcto.");
      }
    }
  </script>
</body>
</html>
